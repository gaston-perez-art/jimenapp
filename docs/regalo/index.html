<style>
  :root{
    --ink:#241F26;
    --paper:#FFFFFF;
    --wine-950:#3E1422;
    --wine-900:#5C1F32;
    --wine-600:#9D3A57;
    --wine-500:#B14A67;
    --bronze:#A9824A;
    --bronze-soft:#EFE3CD;
    --bronze-light:#DCBA84;
    --ease-in:cubic-bezier(.25,.46,.45,.94);
    --ease-ui:cubic-bezier(.16,1,.3,1);
    --sans:'Archivo', system-ui, sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{min-height:100%;}
  body{
    font-family:var(--sans);
    color:#fff;
    background:radial-gradient(120% 80% at 50% 30%, var(--wine-900) 0%, var(--wine-950) 70%);
    background-color:var(--wine-950);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  main{
    min-height:100svh;
    display:flex; flex-direction:column; align-items:center;
    padding:max(40px, env(safe-area-inset-top)) 16px 48px;
    text-align:center;
    overflow-x:clip; /* la tapa y el brillo salen del escenario al volar */
  }

  /* ---------- Encabezado ---------- */
  .head{max-width:420px; transition:opacity .6s var(--ease-in), transform .6s var(--ease-in);}
  .kicker{
    font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--bronze-light);
  }
  .head h1{font-size:clamp(28px, 7.5vw, 40px); font-weight:500; line-height:1.1; margin-top:12px; letter-spacing:-.01em;}
  .head h1 em{font-style:italic; font-weight:700; color:var(--bronze-light);}

  /* ---------- Escenario ---------- */
  .stage{
    position:relative; width:100%; max-width:380px; height:360px; margin-top:24px;
    cursor:pointer; -webkit-tap-highlight-color:transparent; user-select:none;
    touch-action:manipulation;
  }
  .stage:focus-visible{outline:2px solid var(--bronze-light); outline-offset:6px; border-radius:16px;}

  .box{
    position:absolute; left:50%; bottom:20px; width:220px; height:200px; margin-left:-110px;
    z-index:2;
    transition:transform .8s var(--ease-in) .35s, opacity .6s var(--ease-in) .35s;
  }
  .box.idle{animation:bob 3.2s var(--ease-in) infinite;}
  .box.shake{animation:shake .45s var(--ease-ui);}
  @keyframes bob{0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);}}
  @keyframes shake{
    0%,100%{transform:rotate(0);} 20%{transform:rotate(-5deg) scale(1.03);}
    45%{transform:rotate(4deg) scale(1.03);} 70%{transform:rotate(-2deg);}
  }
  .shadow{
    position:absolute; left:50%; bottom:6px; width:190px; height:18px; margin-left:-95px;
    background:radial-gradient(closest-side, rgba(0,0,0,.45), transparent);
    transition:opacity .6s var(--ease-in) .35s;
  }
  .body{
    position:absolute; left:10px; right:10px; bottom:0; height:148px;
    border-radius:6px 6px 10px 10px;
    background:linear-gradient(160deg, var(--wine-600), var(--wine-900) 75%);
    box-shadow:inset 0 -14px 24px rgba(0,0,0,.25), 0 18px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  .rib-v{
    position:absolute; left:50%; width:30px; margin-left:-15px; top:0; bottom:0;
    background:linear-gradient(90deg, var(--bronze), var(--bronze-light) 50%, var(--bronze));
    transform-origin:50% 0;
    transition:transform .5s var(--ease-ui);
  }
  .glow{
    position:absolute; left:50%; bottom:130px; width:260px; height:220px; margin-left:-130px;
    background:radial-gradient(closest-side, rgba(220,186,132,.55), rgba(220,186,132,0));
    opacity:0; transform:scale(.6); z-index:1;
    transition:opacity .7s var(--ease-in), transform .9s var(--ease-in);
    pointer-events:none;
  }
  .lid{
    position:absolute; left:0; right:0; top:34px; height:50px; z-index:3;
    border-radius:8px;
    background:linear-gradient(160deg, var(--wine-500), var(--wine-600) 60%, var(--wine-900));
    box-shadow:0 6px 12px rgba(0,0,0,.25);
    transform-origin:80% 100%;
    transition:transform .8s var(--ease-ui), opacity .6s var(--ease-in) .15s;
  }
  .lid .rib-v{transform-origin:50% 50%;}
  .bow{
    position:absolute; left:50%; top:-30px; width:120px; height:40px; margin-left:-60px;
    transform-origin:50% 100%;
    transition:transform .6s var(--ease-ui), opacity .4s var(--ease-in);
  }
  .bow i{
    position:absolute; top:4px; width:54px; height:34px; border-radius:50%;
    border:9px solid var(--bronze-light);
  }
  .bow i:first-child{left:4px; transform:rotate(-18deg); border-color:var(--bronze-light) var(--bronze) var(--bronze) var(--bronze-light);}
  .bow i:nth-child(2){right:4px; transform:rotate(18deg); border-color:var(--bronze-light) var(--bronze-light) var(--bronze) var(--bronze);}
  .bow b{
    position:absolute; left:50%; top:12px; width:24px; height:24px; margin-left:-12px;
    border-radius:7px; background:linear-gradient(135deg, var(--bronze-light), var(--bronze));
  }

  /* Paso 1: se desata el moño */
  .stage[data-step="1"] .bow,
  .stage[data-step="2"] .bow,
  .stage[data-step="3"] .bow{transform:translateY(-70px) rotate(-30deg) scale(.4); opacity:0;}
  .stage[data-step="1"] .rib-v,
  .stage[data-step="2"] .rib-v,
  .stage[data-step="3"] .rib-v{transform:scaleY(0);}
  /* Paso 2: vuela la tapa */
  .stage[data-step="2"] .lid,
  .stage[data-step="3"] .lid{transform:translate(90px,-150px) rotate(38deg); opacity:0;}
  .stage[data-step="2"] .glow{opacity:1; transform:scale(1);}
  /* Paso 3: sale la tarjeta y la caja se va */
  .stage[data-step="3"] .box{transform:translateY(80px) scale(.9); opacity:0;}
  .stage[data-step="3"] .shadow{opacity:0;}
  .stage[data-step="3"] .glow{opacity:.8; transform:scale(1.5) translateY(80px);}
  .stage[data-step="3"]{cursor:default;}

  /* ---------- Tarjeta ---------- */
  .card{
    position:absolute; left:50%; top:50%; z-index:1;
    width:min(340px, calc(100vw - 32px)); aspect-ratio:1.586;
    padding:20px 22px;
    border-radius:18px;
    background:
      linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,0) 40%),
      linear-gradient(135deg, var(--wine-900) 0%, var(--wine-600) 58%, var(--bronze) 125%);
    box-shadow:0 30px 60px rgba(0,0,0,.45), inset 0 0 0 1px rgba(220,186,132,.45);
    display:flex; flex-direction:column; justify-content:space-between; text-align:left;
    overflow:hidden;
    transform:translate(-50%, 10%) scale(.45);
    opacity:0;
    transition:transform 1.1s var(--ease-ui), opacity .4s var(--ease-in);
  }
  .stage[data-step="3"] .card{transform:translate(-50%, -50%) scale(1); opacity:1; z-index:4;}
  .card::after{
    content:""; position:absolute; top:-50%; left:-60%; width:40%; height:200%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.28), transparent);
    transform:rotate(20deg) translateX(-150%);
  }
  .stage[data-step="3"] .card::after{animation:shine 1.4s var(--ease-in) 1s both;}
  @keyframes shine{to{transform:rotate(20deg) translateX(560%);}}
  .card-top{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .card-brand{display:flex; align-items:center; gap:10px; font-weight:600; font-size:15px;}
  .card-brand img{width:30px; height:30px; border-radius:50%; box-shadow:0 0 0 1.5px rgba(255,255,255,.6);}
  .card-tag{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--bronze-soft);}
  .card-what{font-size:clamp(20px, 6vw, 25px); font-weight:600; line-height:1.15; letter-spacing:-.01em;}
  .card-bottom{display:flex; align-items:flex-end; justify-content:space-between; gap:12px;}
  .card-label{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--bronze-soft); opacity:.85;}
  .card-val{font-size:15px; font-weight:500; margin-top:2px;}
  .card-code{font-family:var(--mono); font-size:14px; letter-spacing:.08em;}

  /* ---------- Pista ---------- */
  .hint{margin-top:8px; min-height:48px; display:flex; flex-direction:column; align-items:center; gap:10px; transition:opacity .4s;}
  .hint p{font-size:15px; color:rgba(255,255,255,.8);}
  .dots{display:flex; gap:8px;}
  .dots span{width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.25); transition:background .3s, transform .3s var(--ease-ui);}
  .dots span.on{background:var(--bronze-light); transform:scale(1.25);}
  .done .hint{opacity:0; pointer-events:none;}

  /* ---------- Revelado ---------- */
  .reveal{
    max-width:420px; width:100%; margin-top:-8px;
    opacity:0; transform:translateY(24px); visibility:hidden;
    transition:opacity 1s var(--ease-in), transform 1s var(--ease-in), visibility 0s 1s;
  }
  .done .reveal{opacity:1; transform:none; visibility:visible; transition-delay:1.1s, 1.1s, 0s;}
  .msg{
    font-size:19px; line-height:1.45; font-weight:400; color:#fff;
  }
  .msg::before{content:"“";} .msg::after{content:"”";}
  .from{margin-top:10px; font-size:15px; color:var(--bronze-light);}
  .vence{margin-top:22px; font-family:var(--mono); font-size:12px; letter-spacing:.06em; color:rgba(255,255,255,.65);}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    min-height:52px; padding:14px 28px; margin-top:24px;
    border-radius:999px; border:0;
    background:linear-gradient(110deg, var(--bronze-light), var(--bronze));
    color:var(--wine-950); font:600 16px/1 var(--sans); text-decoration:none;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
    transition:transform .3s var(--ease-ui), box-shadow .3s var(--ease-ui);
  }
  .btn:hover{transform:translateY(-2px); box-shadow:0 14px 34px rgba(0,0,0,.35);}
  .btn svg{width:20px; height:20px; fill:currentColor;}
  .how{margin-top:14px; font-size:14px; line-height:1.5; color:rgba(255,255,255,.7);}
  .site{display:inline-flex; align-items:center; min-height:44px; margin-top:24px; padding:0 4px; color:#fff; font-size:14px; text-decoration:underline; text-underline-offset:4px; text-decoration-color:rgba(255,255,255,.4);}

  /* ---------- Sin regalo ---------- */
  .empty{max-width:380px; margin-top:18vh;}
  .empty h1{font-size:28px; font-weight:500;}
  .empty p{margin-top:12px; color:rgba(255,255,255,.75); line-height:1.5;}

  /* ---------- Confeti ---------- */
  .confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:10;}
  .confetti i{
    position:absolute; top:-20px; width:8px; height:14px; border-radius:2px;
    animation:fall var(--d) var(--ease-in) var(--w) forwards;
  }
  @keyframes fall{
    to{transform:translate(var(--x), 110vh) rotate(var(--r)); opacity:.2;}
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important; transition-duration:.01ms !important; transition-delay:0s !important;}
  }
</style>
</head>
<body>
<main id="app">
  <noscript>
    <div class="empty">
      <h1>Tenés un regalo</h1>
      <p>Para abrirlo hace falta activar JavaScript en el navegador.</p>
    </div>
  </noscript>
</main>

<script>
(function(){
  var app = document.getElementById('app');
  var WA = '541135863879';

  // El regalo viaja en el hash como JSON en base64url (UTF-8), asi los
  // acentos y los emojis del mensaje sobreviven. Lo genera /regalo/crear/.
  function leer(){
    var m = location.hash.match(/g=([A-Za-z0-9_-]+)/);
    if(!m) return null;
    try{
      var b64 = m[1].replace(/-/g,'+').replace(/_/g,'/');
      var bin = atob(b64);
      var bytes = new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
      var g = JSON.parse(new TextDecoder().decode(bytes));
      return g && g.i ? g : null;
    }catch(e){ return null; }
  }

  function esc(s){
    return String(s || '').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  var g = leer();
  if(!g){
    app.innerHTML =
      '<div class="empty"><h1>Este enlace no trae ningún regalo</h1>' +
      '<p>Puede que se haya cortado al copiarlo. Pedile a quien te lo mandó que te lo reenvíe.</p>' +
      '<a class="site" href="/">Conocé a Jime</a></div>';
    return;
  }

  var texto = '🎁 Hola Jime! Me regalaron una gift card' +
    (g.c ? ' (código ' + g.c + ')' : '') + ' y quiero coordinar para usarla.';
  var wa = 'https://api.whatsapp.com/send?phone=' + WA + '&text=' + encodeURIComponent(texto);

  app.innerHTML =
    '<div class="head">' +
      '<p class="kicker">' + (g.d ? esc(g.d) + ' te mandó' : 'Te mandaron') + ' un regalo</p>' +
      '<h1>' + (g.p ? esc(g.p) + ', esto' : 'Esto') + ' es <em>para vos</em></h1>' +
    '</div>' +
    '<div class="stage" id="stage" data-step="0" role="button" tabindex="0" aria-label="Abrir el regalo">' +
      '<div class="glow"></div>' +
      '<div class="card" aria-hidden="true">' +
        '<div class="card-top">' +
          '<span class="card-brand"><img src="/img/marca/marca-96.png" alt="">Entrená con Jime</span>' +
          '<span class="card-tag">Gift card</span>' +
        '</div>' +
        '<div class="card-what">' + esc(g.i) + '</div>' +
        '<div class="card-bottom">' +
          '<div>' + (g.p ? '<div class="card-label">Para</div><div class="card-val">' + esc(g.p) + '</div>' : '') + '</div>' +
          (g.c ? '<div style="text-align:right"><div class="card-label">Código</div><div class="card-code">' + esc(g.c) + '</div></div>' : '') +
        '</div>' +
      '</div>' +
      '<div class="shadow"></div>' +
      '<div class="box idle" id="box">' +
        '<div class="body"><div class="rib-v"></div></div>' +
        '<div class="lid"><div class="rib-v"></div><div class="bow"><i></i><i></i><b></b></div></div>' +
      '</div>' +
    '</div>' +
    '<div class="hint" aria-live="polite"><p id="hintTxt">Tocá la caja para abrirla</p>' +
      '<div class="dots"><span></span><span></span><span></span></div></div>' +
    '<section class="reveal" id="reveal">' +
      (g.m ? '<p class="msg">' + esc(g.m) + '</p>' : '') +
      (g.d ? '<p class="from">— ' + esc(g.d) + '</p>' : '') +
      (g.v ? '<p class="vence">Válida hasta el ' + esc(g.v) + '</p>' : '') +
      '<a class="btn" id="canje" href="' + wa + '" target="_blank" rel="noopener">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>' +
        'Canjear mi regalo</a>' +
      '<p class="how">Le escribís a Jime por WhatsApp y coordinan juntas cuándo arrancar.</p>' +
      '<a class="site" href="/">Conocé a Jime</a>' +
    '</section>';

  var stage = document.getElementById('stage');
  var box = document.getElementById('box');
  var hintTxt = document.getElementById('hintTxt');
  var dots = app.querySelectorAll('.dots span');
  var HINTS = ['Tocá la caja para abrirla', 'Otra vez', 'Una más'];
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var paso = 0;

  function avanzar(){
    if(paso >= 3) return;
    paso++;
    box.classList.remove('idle', 'shake');
    void box.offsetWidth; // reinicia la animacion de sacudida en cada toque
    if(paso < 3) box.classList.add('shake');
    stage.setAttribute('data-step', paso);
    for(var i=0;i<dots.length;i++) dots[i].classList.toggle('on', i < paso);
    if(paso < 3){
      hintTxt.textContent = HINTS[paso];
    }else{
      app.classList.add('done');
      stage.removeAttribute('role');
      stage.removeAttribute('tabindex');
      stage.setAttribute('aria-label', 'Gift card: ' + g.i);
      if(!reduce) setTimeout(confeti, 450);
      if(window.gtag) gtag('event', 'regalo_abierto');
    }
  }

  stage.addEventListener('click', avanzar);
  stage.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); avanzar(); }
  });
  document.getElementById('canje').addEventListener('click', function(){
    if(window.gtag) gtag('event', 'contacto_whatsapp', { ubicacion: 'regalo' });
  });

  function confeti(){
    var wrap = document.createElement('div');
    wrap.className = 'confetti';
    var colores = ['#DCBA84', '#A9824A', '#EFE3CD', '#B14A67', '#FFFFFF'];
    for(var i=0;i<70;i++){
      var p = document.createElement('i');
      p.style.left = (Math.random()*100) + 'vw';
      p.style.background = colores[i % colores.length];
      p.style.setProperty('--x', (Math.random()*160 - 80) + 'px');
      p.style.setProperty('--r', (Math.random()*720 - 360) + 'deg');
      p.style.setProperty('--d', (2.2 + Math.random()*1.8) + 's');
      p.style.setProperty('--w', (Math.random()*.6) + 's');
      wrap.appendChild(p);
    }
    document.body.appendChild(wrap);
    setTimeout(function(){ wrap.remove(); }, 5000);
  }
})();
</script>
</body>
</html>
